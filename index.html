<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookstore Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Bookstore Manager</h1>

    <nav class="nav-tabs">
        <button class="nav-tab active" data-view="books">Books</button>
        <button class="nav-tab" data-view="authors">Authors</button>
        <button class="nav-tab" data-view="publishers">Publishers</button>
    </nav>

    <main>
        <div id="books-view" class="view-content">
            <div class="container">
                <div class="articles-list">
                    <h2>Books</h2>
                    <ul id="book-list"></ul>
                </div>
                <div class="article-form">
                    <h2>Add / Update Book</h2>
                    <form id="book-form">
                        <input type="text" id="book-id" disabled hidden>
                        <div class="form-group"><label for="book-title">Title</label><input type="text" id="book-title" required></div>
                        <div class="form-group"><label for="book-author-id">Author ID</label><input type="number" id="book-author-id" required></div>
                        <div class="form-group"><label for="book-publisher-id">Publisher ID</label><input type="number" id="book-publisher-id" required></div>
                        <div class="buttons">
                            <button type="button" class="btn-add">Add Book</button>
                            <button type="button" class="btn-update">Update Book</button>
                            <button type="button" class="btn-delete">Delete Book</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div id="authors-view" class="view-content hidden">
            <div class="container">
                <div class="articles-list">
                    <h2>Authors</h2>
                    <ul id="author-list"></ul>
                </div>
                <div class="article-form">
                    <h2>Add / Update Author</h2>
                    <form id="author-form">
                        <input type="text" id="author-id" disabled hidden>
                        <div class="form-group"><label for="author-name">Name</label><input type="text" id="author-name" required></div>
                        <div class="buttons">
                            <button type="button" class="btn-add">Add Author</button>
                            <button type="button" class="btn-update">Update Author</button>
                            <button type="button" class="btn-delete">Delete Author</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div id="publishers-view" class="view-content hidden">
            <div class="container">
                 <div class="articles-list">
                    <h2>Publishers</h2>
                    <ul id="publisher-list"></ul>
                </div>
                <div class="article-form">
                    <h2>Add / Update Publisher</h2>
                    <form id="publisher-form">
                        <input type="text" id="publisher-id" disabled hidden>
                        <div class="form-group"><label for="publisher-name">Name</label><input type="text" id="publisher-name" required></div>
                        <div class="buttons">
                            <button type="button" class="btn-add">Add Publisher</button>
                            <button type="button" class="btn-update">Update Publisher</button>
                            <button type="button" class="btn-delete">Delete Publisher</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
